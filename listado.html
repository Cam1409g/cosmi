
<!DOCTYPE html>

        <div class="admin-layout">

            <aside th:replace="~{general/menuAdmin :: sidebar('categorias')}"></aside>

            <main class="admin-main">

                <section th:replace="~{categoria/fragmentos :: formulario}"></section>

                <section th:replace="~{categoria/fragmentos :: listado}"></section>

                <section th:replace="~{general/fragmentos :: confirmarEliminar(@{/admin/categorias/eliminar},'idCategoria')}"></section>
            </main>
        </div>

        <script th:src="@{/js/modulos/categoria.js}"></script>
