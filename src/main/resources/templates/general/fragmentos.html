<!-- Fragmento #1 que irá en el head de todas las páginas, así se incluye todo lo necesario de configuración-->
<head th:fragment="head">
    <title>[[#{aplicacion.titulo}]]</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
    <link th:href="@{/css/cosmi.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/js/rutinas.js}"></script>
</head>


<!-- Fragmento #2 define el encabezado de las páginas, en concreto el menú y enlaces rápidos.
     Uso: <header th:replace="~{general/fragmentos :: header('inicio')}"></header>
     (el menú es provisional: Camila y Geo lo ajustan con el Figma) -->
<header th:fragment="header(seccion)" class="cosmi-nav">
            <div class="container nav-inner">
                <a class="brand" th:href="@{/}">Cosmi</a>
                <nav class="nav-links">
                    <a th:href="@{/}" th:classappend="${seccion == 'inicio'} ? 'activo'"
                       th:text="#{plantilla.inicio}">Inicio</a>
                    <!--/* TODO: cambiar el # por @{/catalogo} y @{/carrito} cuando existan esas pantallas */-->
                    <a href="#" th:classappend="${seccion == 'catalogo'} ? 'activo'"
                       th:text="#{plantilla.catalogo}">Catálogo</a>
                    <a href="#" class="btn-carrito" th:text="#{plantilla.carrito}">Carrito</a>

                    <th:block th:if="${session.nombreUsuario != null}">
                        <a th:if="${session.rolUsuario == 'ADMIN'}" th:href="@{/admin/inventario}"
                           th:text="#{plantilla.admin}">Administración</a>
                        <span class="saludo" th:text="#{plantilla.saludo} + ' ' + ${session.nombreUsuario}">Hola,</span>
                        <a th:href="@{/logout}" class="link-salir" th:text="#{plantilla.salir}">Salir</a>
                    </th:block>
                    <a th:if="${session.nombreUsuario == null}" th:href="@{/login}"
                       th:classappend="${seccion == 'acceso'} ? 'activo'"
                       th:text="#{plantilla.iniciarSesion}">Iniciar sesión</a>

                    <span class="saludo">
                        <a th:href="@{(lang='es')}">ES</a> ·
                        <a th:href="@{(lang='en')}">EN</a> ·
                        <a th:href="@{(lang='fr')}">FR</a> ·
                        <a th:href="@{(lang='pt')}">PT</a>
                    </span>
                </nav>
            </div>
        </header>

<!-- Fragmento #3 define el footer de las páginas -->
<footer th:fragment="footer" class="p-2 mt-5 text-center d-print-none">
    <p class="lead">[[#{plantilla.derechos}]] &COPY;</p>
</footer>

<!-- Fragmentos #4 define una ventana tipo Toast para mostrar mensajes al usuario -->
<section th:fragment="mostrarToast">
    <div aria-live="polite" aria-atomic="true" 
         class="position-fixed top-50 start-50 translate-middle" style="z-index: 1080;">                
        <div th:if="${error}" class="toast show"
             role="alert"
             aria-live="assertive"                     
             aria-atomic="true"
             data-bs-autohide="true">
            <div class="toast-header text-white bg-danger">
                <i class="fa-solid fa-bomb"></i> <strong class="me-auto"> [[#{error}]]</strong>
            </div>
            <div class="toast-body">
                <p>[[${error}]]</p>
                <div class="mt-2 pt-2 border-top text-center">
                    <button type="button" class="btn btn-secondary btn-sm" 
                            data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                </div>
            </div>
        </div>
        <div th:if="${todoOk}" class="toast show"
             role="status"
             aria-live="polite"
             aria-atomic="true"
             data-bs-autohide="true">
            <div class="toast-header text-white bg-success">
                <i class="fa-solid fa-square-check"></i> <strong class="me-auto"> [[#{atencion}]]</strong>
            </div>
            <div class="toast-body">
                <p>[[${todoOk}]]</p>
                <div class="mt-2 pt-2 border-top text-center">
                    <button type="button" class="btn btn-secondary btn-sm" 
                            data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Fragmentos #5 define una ventana tipo Toast para mostrar de confirmar eliminar -->
<section th:fragment="confirmarEliminar(accionEliminar, nombreId)">
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered custom-modal-animation">
            <div class="modal-content animate-slide-up">
                <form th:action="${accionEliminar}" method="post">
                    <input type="hidden" th:attr="name=${nombreId}" id="modalId"/>
                    <div class="modal-header bg-warning text-white">
                        <h5 class="modal-title" id="modalLabel"><i class="fa-solid fa-circle-radiation"></i> [[#{accion.confirmar}]]</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="[[#{accion.cerrar}]]"></button>
                    </div>
                    <div class="modal-body">
                        <p>[[#{accion.confirmar.texto1}]]<span id="modalDescripcion"></span>?</p>
                        <h6>[[#{accion.confirmar.texto2}]]</h6>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-danger">
                            <i class="fa-solid fa-trash"></i> [[#{accion.eliminar}]]
                        </button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i> [[#{accion.cerrar}]]
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
