<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <!--/* ============ HEAD: Bootstrap y Font Awesome por webjars, luego cosmi.css ============
         Uso: <head th:replace="~{general/fragmentos :: head(#{clave.del.titulo})}"></head> */-->
    <head th:fragment="head(titulo)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title th:text="${titulo} + ' · Cosmi'">Cosmi</title>
        <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">
        <link rel="stylesheet" th:href="@{/css/cosmi.css}">
    </head>

    <body>

        <!--/* ============ NAVBAR de la tienda (provisional: Camila y Geo lo ajustan con el Figma)
             Uso: <header th:replace="~{general/fragmentos :: navbar('inicio')}"></header> */-->
        <header th:fragment="navbar(seccion)" class="cosmi-nav">
            <div class="container nav-inner">
                <a class="brand" th:href="@{/}">Cosmi</a>
                <nav class="nav-links">
                    <a th:href="@{/}" th:classappend="${seccion == 'inicio'} ? 'activo'"
                       th:text="#{plantilla.inicio}">Inicio</a>
                    <!--/* TODO: cambiar el # por @{/catalogo} y @{/carrito} cuando existan esas pantallas */-->
                    <a href="#" th:classappend="${seccion == 'catalogo'} ? 'activo'"
                       th:text="#{plantilla.catalogo}">Catálogo</a>
                    <a href="#" class="btn-carrito" th:text="#{plantilla.carrito}">Carrito</a>

                    <th:block th:if="${session.nombreUsuario != null}">
                        <a th:if="${session.rolUsuario == 'ADMIN'}" th:href="@{/admin/inventario}"
                           th:text="#{plantilla.admin}">Administración</a>
                        <span class="saludo" th:text="#{plantilla.saludo} + ' ' + ${session.nombreUsuario}">Hola,</span>
                        <a th:href="@{/logout}" class="link-salir" th:text="#{plantilla.salir}">Salir</a>
                    </th:block>
                    <a th:if="${session.nombreUsuario == null}" th:href="@{/login}"
                       th:classappend="${seccion == 'acceso'} ? 'activo'"
                       th:text="#{plantilla.iniciarSesion}">Iniciar sesión</a>

                    <span class="saludo">
                        <a th:href="@{(lang='es')}">ES</a> ·
                        <a th:href="@{(lang='en')}">EN</a> ·
                        <a th:href="@{(lang='fr')}">FR</a> ·
                        <a th:href="@{(lang='pt')}">PT</a>
                    </span>
                </nav>
            </div>
        </header>

        <!--/* ============ TOASTS: muestran los mensajes flash "todoOk" y "error" de los controllers ============
             Uso: <div th:replace="~{general/fragmentos :: toasts}"></div> */-->
        <div th:fragment="toasts" class="toast-container position-fixed top-0 end-0 p-3">
            <div th:if="${todoOk != null}" class="toast border-0" role="alert" aria-live="polite"
                 style="background: var(--ok-bg); color: var(--ok);">
                <div class="d-flex">
                    <div class="toast-body" th:text="${todoOk}">Listo</div>
                    <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"
                            th:aria-label="#{accion.cerrar}"></button>
                </div>
            </div>
            <div th:if="${error != null}" class="toast border-0" role="alert" aria-live="assertive"
                 style="background: var(--err-bg); color: var(--err);">
                <div class="d-flex">
                    <div class="toast-body" th:text="${error}">Error</div>
                    <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"
                            th:aria-label="#{accion.cerrar}"></button>
                </div>
            </div>
        </div>

        <!--/* ============ MODAL DE ELIMINAR (uno por página, lo reutilizan todos los botones "eliminar")
             Uso: <div th:replace="~{general/fragmentos :: modalEliminar}"></div>
             El botón que lo abre indica la URL (POST) y el nombre del registro:
             <button type="button" class="btn-cosmi" data-bs-toggle="modal" data-bs-target="#modalEliminar"
                     th:attr="data-url=@{/admin/productos/eliminar/{id}(id=${p.idProducto})},data-nombre=${p.nombre}"> */-->
        <div th:fragment="modalEliminar" class="modal fade" id="modalEliminar" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="border-radius: 20px;">
                    <div class="modal-header border-0">
                        <h5 class="modal-title" th:text="#{accion.confirmar}">Confirmar eliminación</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                th:aria-label="#{accion.cerrar}"></button>
                    </div>
                    <div class="modal-body">
                        <p><span th:text="#{accion.confirmar.texto1}">¿Realmente desea eliminar</span>
                            <strong id="modalEliminarNombre"></strong>?</p>
                        <p class="small" style="color: var(--muted);" th:text="#{accion.confirmar.texto2}">
                            Esta acción no se puede deshacer.</p>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn-cosmi-outline" data-bs-dismiss="modal"
                                th:text="#{accion.cerrar}">Cerrar</button>
                        <form id="formEliminar" method="post" class="m-0">
                            <button type="submit" class="btn-cosmi" th:text="#{accion.eliminar}">Eliminar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!--/* ============ SCRIPTS: jQuery y Bootstrap por webjars + activa toasts y modal
             Uso: <th:block th:replace="~{general/fragmentos :: scripts}"></th:block> al final del body */-->
        <th:block th:fragment="scripts">
            <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
            <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
            <script>
                document.querySelectorAll('.toast').forEach(function (el) {
                    bootstrap.Toast.getOrCreateInstance(el, {delay: 4000}).show();
                });
                var modalEliminar = document.getElementById('modalEliminar');
                if (modalEliminar) {
                    modalEliminar.addEventListener('show.bs.modal', function (e) {
                        var boton = e.relatedTarget;
                        document.getElementById('formEliminar').action = boton.getAttribute('data-url');
                        document.getElementById('modalEliminarNombre').textContent = boton.getAttribute('data-nombre') || '';
                    });
                }
            </script>
        </th:block>

    </body>
</html>
