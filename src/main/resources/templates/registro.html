<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro · Cosmi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 480px;">
    <h2 class="mb-4 text-center">Crear cuenta</h2>

    <form th:action="@{/registro}" th:object="${usuario}" method="post" class="card card-body shadow-sm" novalidate>
        <div class="mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"
                   type="text" id="nombre" th:field="*{nombre}">
            <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="correo">Correo</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'"
                   type="email" id="correo" th:field="*{correo}">
            <div class="invalid-feedback" th:errors="*{correo}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="telefono">Teléfono (opcional)</label>
            <input class="form-control" type="text" id="telefono" th:field="*{telefono}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="contrasena">Contraseña</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('contrasena')} ? 'is-invalid'"
                   type="password" id="contrasena" th:field="*{contrasena}">
            <div class="invalid-feedback" th:errors="*{contrasena}"></div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Registrarse</button>
    </form>
    <p class="text-center mt-3">¿Ya tiene cuenta? <a th:href="@{/login}">Inicie sesión</a></p>
</div>
</body>
</html>
