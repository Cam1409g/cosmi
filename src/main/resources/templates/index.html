<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cosmi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5 text-center">
    <h1 class="mb-3">Cosmi</h1>
    <p class="text-muted">Página temporal. Camila la reemplaza con el catálogo.</p>

    <div sec:authorize="!isAuthenticated()">
        <a class="btn btn-primary" th:href="@{/login}">Iniciar sesión</a>
        <a class="btn btn-outline-primary" th:href="@{/registro}">Registrarse</a>
    </div>

    <div sec:authorize="isAuthenticated()">
        <p>Sesión iniciada como <strong sec:authentication="name"></strong></p>
        <a class="btn btn-outline-secondary" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/inventario}">Inventario</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-outline-danger" type="submit">Cerrar sesión</button>
        </form>
    </div>
</div>
</body>
</html>
