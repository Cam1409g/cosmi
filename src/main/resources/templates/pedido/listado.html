<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>

        <div class="admin-layout">

            <aside th:replace="~{general/menuAdmin :: sidebar('pedidos')}"></aside>

            <main class="admin-main">
                <h1>[[#{pedido.admin.titulo}]]</h1>

                <div th:if="${#lists.isEmpty(pedidos)}" class="alert alert-info">
                    [[#{pedido.vacio}]]
                </div>

                <div th:unless="${#lists.isEmpty(pedidos)}" class="tabla-wrap">
                    <table class="tabla">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>[[#{pedido.fecha}]]</th>
                                <th>[[#{pedido.cliente}]]</th>
                                <th>[[#{carrito.total}]]</th>
                                <th>[[#{pedido.estado}]]</th>
                                <th>[[#{pedido.acciones}]]</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${pedidos}">
                                <td th:text="${p.idPedido}">1</td>
                                <td th:text="${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                                <td th:text="${p.usuario.nombre + ' ' + p.usuario.apellidos}">Cliente</td>
                                <td th:text="${#numbers.formatDecimal(p.total, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                                <td><strong th:text="#{'pedido.estado.' + ${p.estado}}">Pendiente</strong></td>
                                <td>
                                    <div class="d-flex gap-2"
                                         th:unless="${p.estado.name() == 'ENTREGADO' or p.estado.name() == 'CANCELADO'}">
                                        <form th:action="@{/admin/pedidos/estado}" method="post">
                                            <input type="hidden" name="idPedido" th:value="${p.idPedido}"/>
                                            <button type="submit" class="btn btn-sm btn-primary">
                                                <i class="fa-solid fa-forward"></i> [[#{pedido.avanzar}]]
                                            </button>
                                        </form>
                                        <form th:action="@{/admin/pedidos/cancelar}" method="post"
                                              th:if="${p.estado.name() == 'PENDIENTE' or p.estado.name() == 'EN_PREPARACION'}"
                                              th:attr="onsubmit=|return confirm('${#messages.msg('pedido.cancelar.confirmar')}');|">
                                            <input type="hidden" name="idPedido" th:value="${p.idPedido}"/>
                                            <button type="submit" class="btn btn-sm btn-danger">
                                                <i class="fa-solid fa-ban"></i> [[#{pedido.cancelar}]]
                                            </button>
                                        </form>
                                    </div>
                                    <span th:if="${p.estado.name() == 'ENTREGADO' or p.estado.name() == 'CANCELADO'}">&mdash;</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </body>
</html>
