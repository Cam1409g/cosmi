<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header('carrito')}"></header>
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>

        <main class="container my-4">
            <div class="alert alert-success">
                <h1 class="h4">[[#{pedido.ok}]]</h1>
                <p class="mb-0">[[#{pedido.numero}]] <strong th:text="${pedido.idPedido}">1</strong>
                    &middot; [[#{pedido.estado}]]: <strong th:text="#{'pedido.estado.' + ${pedido.estado}}">Pendiente</strong></p>
            </div>

            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>[[#{carrito.datos}]]</th>
                        <th>[[#{producto.precio}]]</th>
                        <th>[[#{carrito.cantidad}]]</th>
                        <th>[[#{carrito.subtotal}]]</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d : ${pedido.detalles}">
                        <td th:text="${d.producto.nombre}">Producto</td>
                        <td th:text="${#numbers.formatDecimal(d.precioUnitario, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                        <td th:text="${d.cantidad}">1</td>
                        <td th:text="${#numbers.formatDecimal(d.precioUnitario * d.cantidad, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <th colspan="3" class="text-end">[[#{carrito.totalCompra}]]</th>
                        <th th:text="${#numbers.formatDecimal(pedido.total, 1, 'COMMA', 2, 'POINT')}">0.00</th>
                    </tr>
                </tfoot>
            </table>

            <a th:href="@{/}" class="btn-cosmi-outline">[[#{carrito.seguirComprando}]]</a>
        </main>
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
