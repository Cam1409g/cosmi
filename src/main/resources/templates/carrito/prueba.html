<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header('catalogo')}"></header>
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>

        <main class="container my-4">
            <h1>[[#{carrito.prueba.titulo}]]</h1>
            <table class="table align-middle mt-3">
                <thead>
                    <tr>
                        <th>[[#{producto.nombre}]]</th>
                        <th>[[#{producto.precio}]]</th>
                        <th>[[#{producto.existencias}]]</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${productos}">
                        <td th:text="${p.nombre}">Producto</td>
                        <td th:text="${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                        <td th:text="${p.existencias}">0</td>
                        <td>
                            <form th:action="@{/carrito/agregar}" method="post" class="d-flex gap-2">
                                <input type="hidden" name="idProducto" th:value="${p.idProducto}"/>
                                <input type="number" name="cantidad" value="1" min="1"
                                       class="form-control form-control-sm" style="width: 80px;"/>
                                <button type="submit" class="btn btn-sm btn-primary">
                                    <i class="fa-solid fa-cart-plus"></i> [[#{accion.agregar}]]
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
