<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Cosmi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 420px;">
    <h2 class="mb-4 text-center">Iniciar sesión</h2>

    <div class="alert alert-success" th:if="${param.registrado}">Cuenta creada. Ya puede iniciar sesión.</div>
    <div class="alert alert-danger" th:if="${param.error}">Correo o contraseña incorrectos.</div>

    <form th:action="@{/login}" method="post" class="card card-body shadow-sm">
        <div class="mb-3">
            <label class="form-label" for="correo">Correo</label>
            <input class="form-control" type="email" id="correo" name="correo" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="contrasena">Contraseña</label>
            <input class="form-control" type="password" id="contrasena" name="contrasena" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
    </form>
    <p class="text-center mt-3">¿No tiene cuenta? <a th:href="@{/registro}">Regístrese</a></p>
</div>
</body>
</html>
