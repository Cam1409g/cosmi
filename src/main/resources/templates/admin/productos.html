<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Productos')}"></head>
<body>
<div class="admin-layout">

    <aside th:replace="~{fragments/admin-sidebar :: sidebar('productos')}"></aside>

    <main class="admin-main">
        <h1>Productos</h1>

        <div class="aviso aviso-ok" th:if="${exito}" th:text="${exito}"></div>
        <div class="aviso aviso-error" th:if="${error}" th:text="${error}"></div>

        <!-- Formulario: crear o editar -->
        <div class="cosmi-card mb-4 p-3">
            <h2 class="h5" th:text="${producto.id == null} ? 'Nuevo producto' : 'Editar producto'">Nuevo producto</h2>

            <form th:action="@{/admin/productos/guardar}" th:object="${producto}"
                  method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input class="form-control" id="nombre" type="text" th:field="*{nombre}">
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="categoria">Categoría</label>
                        <select class="form-select" id="categoria" name="categoria.id">
                            <option value="">-- Sin categoría --</option>
                            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                                    th:selected="${producto.categoria != null and producto.categoria.id == c.id}">Skincare</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="descripcion">Descripción</label>
                        <textarea class="form-control" id="descripcion" rows="2" th:field="*{descripcion}"></textarea>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="precio">Precio (&#8353;)</label>
                        <input class="form-control" id="precio" type="number" step="0.01" min="0" th:field="*{precio}">
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="stock">Stock</label>
                        <input class="form-control" id="stock" type="number" min="0" th:field="*{stock}">
                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="tipoPiel">Tipo de piel</label>
                        <select class="form-select" id="tipoPiel" name="tipoPiel">
                            <option th:each="t : ${ {'todas','seca','grasa','mixta','normal','sensible'} }"
                                    th:value="${t}" th:text="${t}" th:selected="${producto.tipoPiel == t}">todas</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label" for="imagenFile">Imagen (JPG o PNG, máx. 2 MB)</label>
                        <input class="form-control" id="imagenFile" type="file" name="imagenFile"
                               accept="image/png,image/jpeg">
                    </div>
                </div>

                <div class="mt-3">
                    <button type="submit" class="btn-cosmi">Guardar</button>
                    <a th:if="${producto.id != null}" th:href="@{/admin/productos}" class="btn-cosmi-outline">Cancelar</a>
                </div>
            </form>
        </div>

        <!-- Listado -->
        <div class="tabla-wrap">
            <table class="tabla">
                <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th style="text-align:center;">Stock</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td>
                        <img th:if="${p.imagen != null}" th:src="@{${p.imagen}}" alt="" width="48" height="48"
                             style="object-fit:cover; border-radius:8px;">
                    </td>
                    <td class="producto" th:text="${p.nombre}">Producto</td>
                    <td th:text="${p.categoria != null ? p.categoria.nombre : '-'}">Skincare</td>
                    <td>&#8353;[[${#numbers.formatDecimal(p.precio, 0, 'COMMA', 2, 'POINT')}]]</td>
                    <td class="stock" th:text="${p.stock}">0</td>
                    <td>
                        <span class="estado-ok" th:if="${p.activo}">Activo</span>
                        <span class="estado-agotado" th:unless="${p.activo}">Inactivo</span>
                    </td>
                    <td>
                        <a class="btn-cosmi-outline" th:href="@{/admin/productos(editar=${p.id})}">Editar</a>
                        <form class="d-inline" th:action="@{/admin/productos/{id}/estado(id=${p.id})}" method="post">
                            <button class="btn-cosmi-dark" type="submit" th:text="${p.activo} ? 'Desactivar' : 'Activar'">Desactivar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="7" style="text-align:center; color:#6b5a5f;">No hay productos registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
