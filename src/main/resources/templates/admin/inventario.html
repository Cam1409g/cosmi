<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Inventario')}"></head>
<body>
<div class="admin-layout">

    <aside th:replace="~{fragments/admin-sidebar :: sidebar('inventario')}"></aside>

    <main class="admin-main">
        <h1>Inventario</h1>

        <div class="aviso aviso-ok" th:if="${exito}" th:text="${exito}"></div>
        <div class="aviso aviso-error" th:if="${error}" th:text="${error}"></div>

        <!-- Resumen -->
        <div class="row g-3">
            <div class="col-md-4">
                <div class="stat">
                    <span class="titulo">Productos activos</span>
                    <strong th:text="${totalActivos}">32</strong>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat stat-warn">
                    <span class="titulo">Stock bajo (<span th:text="${stockBajo}">5</span> o menos)</span>
                    <strong th:text="${totalStockBajo}">3</strong>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat stat-error">
                    <span class="titulo">Agotados</span>
                    <strong th:text="${totalAgotados}">1</strong>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="tabla-wrap">
            <table class="tabla">
                <thead>
                <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th style="text-align:center;">Stock actual</th>
                    <th>Alerta</th>
                    <th>Ajustar stock</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}"
                    th:classappend="${p.stock == 0} ? 'fila-agotado' : (${p.stock <= stockBajo} ? 'fila-bajo' : '')">
                    <td class="producto" th:text="${p.nombre}">Producto</td>
                    <td th:text="${p.categoria != null ? p.categoria.nombre : '-'}">Skincare</td>
                    <td class="stock" th:text="${p.stock}">0</td>
                    <td>
                        <span class="estado-agotado" th:if="${p.stock == 0}">Agotado</span>
                        <span class="estado-bajo" th:if="${p.stock > 0 and p.stock <= stockBajo}">Stock bajo</span>
                        <span class="estado-ok" th:if="${p.stock > stockBajo}">OK</span>
                    </td>
                    <td>
                        <form class="ajuste" th:action="@{/admin/inventario/{id}/stock(id=${p.id})}" method="post">
                            <span>Nuevo</span>
                            <input class="form-control" type="number" name="stock" th:value="${p.stock}" required>
                            <button class="btn-cosmi-dark" type="submit">Guardar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="5" style="text-align:center; color:#6b5a5f;">No hay productos registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
