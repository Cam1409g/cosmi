<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario · Cosmi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Inventario</h2>
        <a class="btn btn-outline-secondary" th:href="@{/}">Ver tienda</a>
    </div>

    <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <p class="text-muted">Los productos en rojo tienen <strong th:text="${stockBajo}">5</strong> unidades o menos.</p>

    <table class="table table-hover align-middle bg-white shadow-sm">
        <thead class="table-light">
            <tr><th>Producto</th><th>Categoría</th><th class="text-center">Stock</th><th>Estado</th><th style="width: 240px;">Ajustar stock</th></tr>
        </thead>
        <tbody>
            <tr th:each="p : ${productos}" th:classappend="${p.stock <= stockBajo} ? 'table-danger'">
                <td th:text="${p.nombre}"></td>
                <td th:text="${p.categoria != null ? p.categoria.nombre : '-'}"></td>
                <td class="text-center" th:text="${p.stock}"></td>
                <td>
                    <span class="badge bg-dark" th:if="${p.stock == 0}">Agotado</span>
                    <span class="badge bg-warning text-dark" th:if="${p.stock > 0 and p.stock <= stockBajo}">Poco stock</span>
                    <span class="badge bg-success" th:if="${p.stock > stockBajo}">Disponible</span>
                </td>
                <td>
                    <form th:action="@{/admin/inventario/{id}/stock(id=${p.id})}" method="post" class="d-flex gap-2">
                        <input class="form-control form-control-sm" type="number" name="stock" th:value="${p.stock}" required>
                        <button class="btn btn-sm btn-primary" type="submit">Guardar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(productos)}"><td colspan="5" class="text-center text-muted">No hay productos registrados.</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
