<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Pedidos')}"></head>
<body>
<div class="admin-layout">

    <aside th:replace="~{fragments/admin-sidebar :: sidebar('pedidos')}"></aside>

    <main class="admin-main">
        <h1>Pedidos</h1>

        <div class="aviso aviso-ok" th:if="${exito}" th:text="${exito}"></div>
        <div class="aviso aviso-error" th:if="${error}" th:text="${error}"></div>

        <div class="tabla-wrap">
            <table class="tabla">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Productos</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pedidos}">
                    <td th:text="${p.id}">1</td>
                    <td>[[${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}]]</td>
                    <td>
                        [[${p.usuario.nombre}]]<br>
                        <small th:text="${p.usuario.correo}">correo</small>
                    </td>
                    <td>
                        <div th:each="d : ${p.detalles}">
                            [[${d.cantidad}]] &times; [[${d.producto.nombre}]]
                        </div>
                    </td>
                    <td>&#8353;[[${#numbers.formatDecimal(p.total, 0, 'COMMA', 2, 'POINT')}]]</td>
                    <td>
                        <span th:text="${etiquetas[p.estado]}"
                              th:classappend="${p.estado.name() == 'CANCELADO'} ? 'estado-agotado' : (${p.estado.name() == 'ENTREGADO'} ? 'estado-ok' : 'estado-bajo')">Pendiente</span>
                    </td>
                    <td>
                        <form class="d-inline" th:action="@{/admin/pedidos/{id}/avanzar(id=${p.id})}" method="post"
                              th:if="${p.estado.name() == 'PENDIENTE' or p.estado.name() == 'EN_PREPARACION' or p.estado.name() == 'EN_CAMINO'}">
                            <button class="btn-cosmi-dark" type="submit"
                                    th:text="${p.estado.name() == 'PENDIENTE' ? 'Pasar a En preparación' : (p.estado.name() == 'EN_PREPARACION' ? 'Pasar a En camino' : 'Marcar como Entregado')}">Avanzar</button>
                        </form>
                        <form class="d-inline" th:action="@{/admin/pedidos/{id}/cancelar(id=${p.id})}" method="post"
                              th:if="${p.estado.name() == 'PENDIENTE' or p.estado.name() == 'EN_PREPARACION'}"
                              onsubmit="return confirm('¿Cancelar este pedido? Se devolverá el stock.');">
                            <button class="btn-cosmi-outline" type="submit">Cancelar</button>
                        </form>
                        <span th:if="${p.estado.name() == 'ENTREGADO' or p.estado.name() == 'CANCELADO'}">&mdash;</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(pedidos)}">
                    <td colspan="7" style="text-align:center; color:#6b5a5f;">No hay pedidos todavía.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
