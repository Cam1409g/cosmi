spring.application.name=cosmi

# --- Base de datos (cambien la clave por la de su MySQL local) ---
spring.datasource.url=jdbc:mysql://localhost:3306/cosmi?createDatabaseIfNotExists=true&serverTimezone=America/Costa_Rica
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Subida de imágenes (HU15, máximo 2 MB) ---
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
